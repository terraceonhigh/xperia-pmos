# Kernel command line arguments for the Sony Xperia 10 III (pdx213).
#
# Every line here is carried by both the stock Sony boot partition
# (stock-partitions/boot.000) and by build/boot-pmos-hybrid-touch.img, the
# image confirmed to boot on this handset. One argument per line; see
# /usr/lib/kernel-cmdline.d/00-base.conf for the format.
androidboot.hardware=qcom
androidboot.usbcontroller=a600000.dwc3
lpm_levels.sleep_disabled=1
service_locator.enable=1
# The SM6350 needs a large software IO TLB; stock Sony sets the same value.
swiotlb=2048
